<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Cat 4 Consulting</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .nf-wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 40px 24px;
    }
    .nf-code {
      font-family: var(--font-mono);
      font-size: 13px;
      letter-spacing: 0.14em;
      color: var(--orange);
      margin-bottom: 18px;
    }
    .nf-wrap h1 { font-size: clamp(40px, 7vw, 72px); margin-bottom: 16px; }
    .nf-wrap p { color: var(--text-mid); margin-bottom: 30px; }
  </style>
</head>
<body>
  <div class="nf-wrap">
    <div>
      <p class="nf-code">// ERROR 404 — PAGE NOT FOUND</p>
      <h1>This page got denied.<br>(Not by us.)</h1>
      <p>The line item you're looking for isn't on this file.</p>
      <a class="btn btn-primary" href="/">Back to the site</a>
    </div>
  </div>
</body>
</html>
